# =========================
# HYPRLOCK - Minimal macOS
# =========================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255,255,255,1.0)

    font_size = 90
    font_family = JetBrainsMono Nerd Font

    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(220,220,220,1.0)

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 85
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    color = rgba(255,255,255,0.9)

    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, -40
    halign = center
    valign = center
}

# Caja de contraseña
input-field {
    monitor =

    size = 320, 60

    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(137,180,250)
    inner_color = rgba(30,30,46,0.75)
    font_color = rgb(205,214,244)

    fade_on_empty = false

    placeholder_text = <i>Password...</i>

    position = 0, -140
    halign = center
    valign = center

    check_color = rgb(166,227,161)
    fail_color = rgb(243,139,168)
}
